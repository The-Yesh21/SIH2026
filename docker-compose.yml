version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railrakshak-ml-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: railrakshak-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
